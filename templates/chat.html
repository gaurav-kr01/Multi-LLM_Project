<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ model_type|capitalize }}</title>
    <style>
       
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .theme-gemini { --main-color: #4285F4; --bg-color: #e8f0fe; }
        .theme-claude { --main-color: #FF6F00; --bg-color: #fff3e0; }
        .theme-openai { --main-color: #10a37f; --bg-color: #f3e5f5; }

        
        .chat-card {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Keeps headers inside rounded corners */
            border-top: 6px solid var(--main-color);
        }

        
        .chat-header {
            background: var(--main-color);
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.4); }

        
        .messages-area {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        
        .msg {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            position: relative;
            word-wrap: break-word;
        }

        
        .user {
            align-self: flex-end;
            background: var(--main-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

       
        .assistant {
            align-self: flex-start;
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        
        .label {
            font-size: 11px;
            margin-bottom: 5px;
            opacity: 0.8;
            font-weight: bold;
            text-transform: uppercase;
        }

        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--main-color);
        }
        .send-btn {
            background: var(--main-color);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.1); }

    </style>
</head>
<body>

    <div class="chat-card theme-{{ 'openai' if model_type == 'openai' else ('claude' if model_type == 'claude' else 'gemini') }}">
        
        <div class="chat-header">
            <span>Continue with {{ model_type|capitalize }}</span>
            <a href="/" class="back-btn">← New Comparison</a>
        </div>

        <div class="messages-area" id="scroller">
            {% for msg in chat_history %}
                <div class="msg {{ 'user' if msg.role == 'user' else 'assistant' }}">
                    <div class="label">{{ 'You' if msg.role == 'user' else model_type }}</div>
                    {{ msg.content }}
                </div>
            {% endfor %}
        </div>

        <form class="input-area" method="POST" action="/chat/{{ model_type }}">
            <input type="text" name="prompt" placeholder="Type your message to {{ model_type|capitalize }}..." required autofocus autocomplete="off">
            <button type="submit" class="send-btn">➤</button>
        </form>

    </div>

    <script>
        const chatBox = document.getElementById('scroller');
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>

</body>
</html>
