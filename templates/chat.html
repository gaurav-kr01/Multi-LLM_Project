<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ model_name | capitalize }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white h-screen flex flex-col font-sans">
    <header class="p-6 border-b border-slate-800 bg-[#1e293b]/50 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">Conversation: <span class="text-sky-400">{{ model_name | capitalize }}</span></h1>
            <a href="/" class="text-xs text-slate-500 hover:text-sky-500">← Back to Comparison</a>
        </div>
    </header>

    <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 max-w-5xl mx-auto w-full custom-scrollbar">
        </div>

    <div class="p-6 bg-[#1e293b] border-t border-slate-800">
        <div class="max-w-5xl mx-auto flex gap-4">
            <input id="user-input" type="text" 
                onkeydown="if(event.key === 'Enter') sendToModel()"
                class="flex-1 bg-slate-900 p-4 rounded-xl outline-none border border-slate-700 focus:border-sky-500 transition-all" 
                placeholder="Continue the conversation...">
            <button onclick="sendToModel()" class="bg-sky-600 hover:bg-sky-500 px-8 py-4 rounded-xl font-bold transition-all">Send</button>
        </div>
    </div>

    <script>
        const model = "{{ model_name }}";
        const chatBox = document.getElementById('chat-box');

        // Restore entire history from server session on page load
        window.onload = function() {
            const sessionData = {{ session | tojson | safe if session else 'null' }};
            const history = sessionData ? sessionData[`history_${model}`] : null;
            
            if (history && history.length > 0) {
                history.forEach(msg => appendMessage(msg.role, msg.content));
            } else {
                appendMessage('assistant', `Hello! I am your ${model} assistant. How can I help today?`);
            }
        };

        function appendMessage(role, content) {
            const isUser = role === 'user';
            const alignment = isUser ? 'justify-end' : 'justify-start';
            const color = isUser ? 'bg-sky-600' : 'bg-slate-800 border border-slate-700';
            chatBox.innerHTML += `
                <div class="flex ${alignment}">
                    <div class="${color} p-4 rounded-2xl max-w-[80%] shadow-lg">${content}</div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendToModel() {
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if(!prompt) return;

            appendMessage('user', prompt);
            input.value = '';

            try {
                const res = await fetch(`/chat/${model}/api?prompt=${encodeURIComponent(prompt)}`);
                const data = await res.json();
                appendMessage('assistant', data.answer);
            } catch(e) { console.error("Error:", e); }
        }
    </script>
</body>
</html>
